<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="corpo">
    <div class="card-agendamento">
      <h1>Agendar:</h1>
      
      <h2 id="tituloAgendamento"></h2>

      <p class="info" id="tempoValor"></p>

      <form action="">
        <div>
          <label for="name">Nome:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Seu nome"
            required
          />
        </div>

        <div>
          <label for="telefone">Telefone:</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(00) 90000-0000"
            required
          />
        </div>

        <div>
          <label for="date">Data:</label>
          <input type="date" id="date" name="date" required />
        </div>

        <label>Horário</label>

        <div class="horarios">
          <button type="button" class="horario">09:00</button>
          <button type="button" class="horario">10:00</button>
          <button type="button" class="horario">11:00</button>
          <button type="button" class="horario">14:00</button>
          <button type="button" class="horario">15:00</button>
          <button type="button" class="horario">16:00</button>
        </div>

        <div class="pix">
          <strong>Pagamento via PIX</strong>

          <p>Chave PIX:</p>

          <span id="pixKey">11999999999</span>
        </div>

        <div class="botoes">
          <button class="btn cancelar" onclick="window.location.href='index.html'">Cancelar</button>
          <button class="btn" id="btnConfirmar">Confirmar</button>
        </div>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
