<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sobrancelhas Perfeitas</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header">
      <div class="container cabecalho">
        <img
          src="assets/images/foto-perfil.png"
          alt="Designer de sobrancelhas"
          class="avatar"
        />

        <div class="cabecalho-texto">
          <h1>Sobrancelhas Perfeitas</h1>
          <p>Realce sua beleza natural com design profissional</p>
        </div>
      </div>
    </header>

    <!-- CONTEÚDO -->
    <main class="container">
      <section class="servicos">
        <h2>Nossos Serviços</h2>

        <!-- GRID SERVIÇOS -->
        <div class="grid-servicoes">

          <!-- CARD 1 -->
          <article class="card">
            <img
              src="assets/images/photo-1487412947147-5cebf100ffc2.jpg"
              alt="Design de sobrancelhas sendo realizado"
              class="card-img"
            />

            <div class="card-body">
              <h3>Design de Sobrancelhas</h3>
              <p>
                Modelagem completa com medição, pinça e finalização perfeita.
              </p>

              <div class="card-info">
                <div class="tempo">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                  <span>30 min</span>
                </div>
                <strong class="preco">R$ 50,00</strong>
              </div>
              <button class="btn">Agendar agora</button>
            </div>
          </article>

          <!-- CARD 2 -->
           <article class="card">
            <img
              src="assets/images/photo-1522337360788-8b13dee7a37e.jpg"
              alt="Henna"
              class="card-img"
            />

            <div class="card-body">
              <h3>Henna</h3>
              <p>
                Modelagem completa com medição, pinça e finalização perfeita.
              </p>

              <div class="card-info">
                <div class="tempo">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                  <span>45 min</span>
                </div>
                <strong class="preco">R$ 70,00</strong>
              </div>
              <button class="btn">Agendar agora</button>
            </div>
          </article>
        </div>
      </section>
    </main>
    <script src="js/home.js"></script>
  </body>
</html>
