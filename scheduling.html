<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendamento</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="corpo">
    <div class="card-agendamento">
      <h1>Agendar:</h1>
      
      <h2 id="tituloAgendamento"></h2>

      <p class="info" id="tempoValor"></p>

      <form id="form" action="">
        <div>
          <label for="name">Nome:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Seu nome"
            required
          />
        </div>

        <div>
          <label for="telefone">Telefone:</label>
          <input
            type="tel"
            id="telefone"
            name="telefone"
            placeholder="(00) 90000-0000"
            required
          />
        </div>

        <div>
          <label for="date">Data:</label>
          <input type="date" id="date" name="date" required />
        </div>

        <label>Horários disponíveis:</label>
        <p class="instrucao-horario">Selecione uma data paraliberar os horarios!</p>

        <div id="container-botoes" class="horarios"></div>

        <div class="pix">
          <strong>Pagamento via PIX</strong>

          <p>Chave PIX:</p>

          <span id="pixKey">11999999999</span>
        </div>

        <div class="botoes">
          <button class="btn cancelar" onclick="window.location.href='index.html'">Cancelar</button>
          <button type="submit" class="btn" id="btnConfirmar">Confirmar</button>
        </div>
      </form>
    </div>
    <script type="module" src="js/pages/scheduling-page.js"></script>
  </body>
</html>
